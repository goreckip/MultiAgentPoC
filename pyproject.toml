[project]
name = "multiagent-poc"
version = "0.1.0"
description = "Multi-Agent Retail Ops Assistant — RAG + intent classification + sub-agents + data validation PoC"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "pydantic>=2.8",
    "streamlit>=1.38",
    "langfuse>=3.0",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` covers the live end-to-end test: two real Ollama calls, ~4-5 min on CPU.
# Excluded by default so the normal suite stays fast; run it with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: live end-to-end test requiring a running Ollama (minutes, not seconds)"]
